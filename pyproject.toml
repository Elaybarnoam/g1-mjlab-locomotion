[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "g1-mjlab-locomotion"
version = "0.2.0"
description = "Evidence-led Unitree G1 standing and locomotion research with mjlab and MuJoCo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Elay Barnoam"}]
maintainers = [{name = "Elay Barnoam"}]
keywords = ["reinforcement-learning", "robotics", "humanoid", "mujoco", "mjlab", "ppo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
motion = [
  "numpy>=2.0,<3",
]
native = [
  "mujoco~=3.11.0",
  "numpy>=2.0,<3",
  "onnxruntime>=1.24,<2",
]
video = [
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
]
train = [
  "mjlab @ git+https://github.com/mujocolab/mjlab.git@8ee51fbcf806a7419189f706d9e394cbeb7790fa",
  "mujoco-warp==3.11.0",
  "onnxruntime>=1.24,<2",
  "rsl-rl-lib==5.5.0",
  "torch==2.13.0",
  "warp-lang==1.14.0",
]

[project.scripts]
g1-mjlab = "g1_mjlab.cli:main"

[project.urls]
Homepage = "https://github.com/elaybarnoam/g1-mjlab-locomotion"
Documentation = "https://github.com/elaybarnoam/g1-mjlab-locomotion/tree/main/docs"
Repository = "https://github.com/elaybarnoam/g1-mjlab-locomotion"
Issues = "https://github.com/elaybarnoam/g1-mjlab-locomotion/issues"
Changelog = "https://github.com/elaybarnoam/g1-mjlab-locomotion/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "check-wheel-contents>=0.6,<1",
  "mypy>=1.18,<2",
  "numpy>=2.0,<3",
  "pre-commit>=4.3,<5",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<1",
  "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/g1_mjlab"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
  "unit: deterministic test without a simulator process",
  "native: requires native MuJoCo/ONNX dependencies",
  "simulator: requires the pinned mjlab simulator runtime",
  "gpu: requires a CUDA-capable qualified GPU runtime",
  "slow: long-running integration test",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["g1_mjlab"]
omit = [
  "*/g1_mjlab/cli.py",
  "*/g1_mjlab/deployment.py",
  "*/g1_mjlab/diagnostics.py",
  "*/g1_mjlab/environment.py",
  "*/g1_mjlab/native_media.py",
  "*/g1_mjlab/motion/preparation.py",
  "*/g1_mjlab/tasks/walking_mdp.py",
  "*/g1_mjlab/tasks/walking_contact.py",
  "*/g1_mjlab/tasks/walking_v1.py",
  "*/g1_mjlab/qualification.py",
  "*/g1_mjlab/rl_adapter.py",
  "*/g1_mjlab/runtime.py",
  "*/g1_mjlab/standing_task.py",
  "*/g1_mjlab/training.py",
  "*/g1_mjlab/tasks/standing_v1.py",
  "*/g1_mjlab/walking_diagnostics.py",
  "*/g1_mjlab/walking_measurement.py",
  "*/g1_mjlab/walking_runtime.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/g1_mjlab"]

[[tool.mypy.overrides]]
module = [
  "imageio.*",
  "mjlab.*",
  "mujoco.*",
  "numpy.*",
  "onnxruntime.*",
  "rsl_rl.*",
  "tensorboard.*",
  "tensordict.*",
  "torch.*",
  "warp.*",
]
ignore_missing_imports = true
