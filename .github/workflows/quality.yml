name: quality

on:
  push:
    branches: [main, "feature/**", "fix/**", "codex/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install development and native dependencies
        run: uv sync --locked --group dev --extra native --extra video
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Test
        # Portable runners omit Torch; its parity tests skip, so their branches
        # cannot contribute to coverage. The full training environment keeps
        # the project-wide 80% gate from pyproject.toml.
        run: >-
          uv run --no-sync pytest -m "not simulator and not gpu and not slow"
          --cov --cov-report=term-missing --cov-fail-under=79
      - name: Repository policy
        run: uv run --no-sync python scripts/check_repository.py
